<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gold Halo Preloader — Light</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

// ---------- config ----------
const MATCAP_URL = window.MATCAP_DATA || './matcap-gold.jpg';
const SIZE = 1 / 3;          // overall halo size
const MIN_SILHOUETTE = 2.2;   // seconds of white silhouette before the reveal can start
const T_SCALE   = 1.0;        // scale-up duration
const T_REVEAL  = 4.0;        // gold sweep duration

// ---------- setup ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.z = 6;

const matcap = new THREE.TextureLoader().load(MATCAP_URL);
// raw in, raw out: no colorspace conversion anywhere, matcap looks exactly like the PNG

const material = new THREE.ShaderMaterial({
  uniforms: {
    uMatcap: { value: matcap },
    uReveal: { value: 0 },   // 0 = flat black silhouette, 1 = full gold
    uTime:   { value: 0 },
  },
  vertexShader: /* glsl */`
    varying vec3 vNormal;
    varying vec3 vViewPos;
    varying vec3 vObjPos;
    void main() {
      vObjPos  = position;
      vNormal  = normalize(normalMatrix * normal);
      vec4 mv  = modelViewMatrix * vec4(position, 1.0);
      vViewPos = -mv.xyz;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D uMatcap;
    uniform float uReveal;
    uniform float uTime;
    varying vec3 vNormal;
    varying vec3 vViewPos;
    varying vec3 vObjPos;

    // cheap 3D value noise
    float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
    float noise(vec3 x) {
      vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                     mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                 mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                     mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
    }

    void main() {
      // matcap lookup (same math as MeshMatcapMaterial, perspective-corrected)
      vec3 n = normalize(vNormal);
      vec3 v = normalize(vViewPos);
      vec3 x = normalize(vec3(v.z, 0.0, -v.x));
      vec3 y = cross(v, x);
      vec2 uv = vec2(dot(x, n), dot(y, n)) * 0.495 + 0.5;
      vec3 gold = texture2D(uMatcap, uv).rgb;

      // reveal field: starts at one point on the ring, spreads both ways around it, noisy front
      float ang   = abs(atan(vObjPos.y, vObjPos.x)) / 3.14159265;   // 0 at +X, 1 at -X
      float n1    = noise(vObjPos * 5.0 + uTime * 0.6);
      float field = ang + n1 * 0.3;                                   // 0..1.3
      float t     = mix(-0.2, 1.5, uReveal);                          // threshold sweeps past both ends

      float revealed = 1.0 - smoothstep(t - 0.04, t, field);
      float edge     = 1.0 - smoothstep(0.0, 0.07, abs(field - t));   // molten band at the front

      vec3 col = mix(vec3(0.0), gold, revealed);
      col += edge * vec3(1.0, 0.72, 0.32) * 1.6;
      gl_FragColor = vec4(col, 1.0);
    }
  `,
});

const halo = new THREE.Mesh(new THREE.TorusGeometry(1, 0.22, 64, 256), material);
scene.add(halo);

// ---------- timeline ----------
const easeOutBack  = t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * (t - 1) ** 3 + c * (t - 1) ** 2; };
const easeInOut    = t => t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
const clamp01      = t => Math.min(Math.max(t, 0), 1);

let start, revealAt, assetsReady;

// Replace this with your real loading (fonts, images, LoadingManager.onLoad, etc).
// The black silhouette phase holds until this resolves AND MIN_SILHOUETTE has passed.
function fakeLoad() { return new Promise(r => setTimeout(r, 1200 + Math.random() * 1500)); }

function play() {
  start = performance.now() / 1000;
  revealAt = Infinity;
  assetsReady = false;
  material.uniforms.uReveal.value = 0;
  halo.scale.setScalar(SIZE);
  fakeLoad().then(() => { assetsReady = true; });
}

let angle = 0, last = performance.now() / 1000;

function tick() {
  const now = performance.now() / 1000;
  const dt  = Math.min(now - last, 0.05); last = now;
  const el  = now - start;

  if (revealAt === Infinity && assetsReady && el >= MIN_SILHOUETTE) revealAt = el;
  const r = el - revealAt;                                   // time since reveal began (negative before)

  // 1) scale up a bit
  const s = clamp01(r / T_SCALE);
  halo.scale.setScalar(SIZE * (1 + 0.18 * easeOutBack(s)));

  // 2) gold sweep, starts mid-scale
  const rv = clamp01((r - T_SCALE * 0.45) / T_REVEAL);
  material.uniforms.uReveal.value = easeInOut(rv);

  // spin on X; fast while it's a flat silhouette, settles once the gold proves it's 3D
  const speed = THREE.MathUtils.lerp(1.6, 0.6, easeInOut(rv));
  angle += speed * dt;
  halo.rotation.x = angle;

  material.uniforms.uTime.value = now;
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.domElement.addEventListener('click', play);   // click to replay

play();
tick();
</script>
